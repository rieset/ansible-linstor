---
- name: check if linstor-satellite service exists
  shell: systemctl list-unit-files | grep -q linstor-satellite.service
  register: service_check
  changed_when: false
  failed_when: false

- name: enable and start LINSTOR Satellite service
  systemd:
    name: linstor-satellite
    daemon_reload: true
    enabled: true
    state: started
  register: satellite_service_result
  when: service_check.rc == 0

- name: display satellite service status
  debug:
    msg: "LINSTOR Satellite service enabled and started successfully"
  when: satellite_service_result.changed | default(false)

- name: fail if linstor-satellite service not found
  fail:
    msg: "linstor-satellite service not found. Please ensure linstor-satellite package is installed. The pre-install role should install it automatically."
  when: service_check.rc != 0

- name: ensure linstor config directory exists
  file:
    path: /etc/linstor
    state: directory
    mode: '0755'

- name: setup linstor-client.conf with all controllers
  template:
    src: linstor-client.j2
    dest: /etc/linstor/linstor-client.conf
    mode: '0644'
  when:
    - groups['controller'] is defined
    - groups['controller'] | length > 0

- name: restart linstor-satellite service after config update
  systemd:
    name: linstor-satellite
    state: restarted
  when:
    - service_check.rc == 0
    - groups['controller'] is defined
    - groups['controller'] | length > 0

# Readiness via SSH: только проверка сервиса внутри машины, без портов.
- name: wait for satellite service to be active
  command: systemctl is-active linstor-satellite
  register: satellite_active
  until: satellite_active.stdout == 'active'
  retries: 30
  delay: 2
  changed_when: false
  when: service_check.rc == 0

