---
# Ansible variables
ansible_user: ansible
ansible_ssh_private_key_file: ~/.ssh/ansible_key
ansible_become: yes

# LINSTOR variables
drbd_backing_disk: /dev/sdb
drbd_replication_network: 192.168.100.0/24
# Open UFW ports for LINSTOR on controller/satellite hosts (rules applied before starting services). Set false if using firewalld or no firewall.
linstor_configure_ufw: true
# Restrict LINSTOR ports to this network only (CIDR). Uses drbd_replication_network so only cluster nodes can connect.
linstor_ufw_allow_from: "{{ drbd_replication_network }}"
# By default: reset UFW (drop all rules), then allow only SSH (22) and LINSTOR ports. Set false to skip reset (keep existing rules).
linstor_ufw_reset_then_allow: true

# LINBIT portal variables
lb_user: ""
lb_pass: ""
lb_con_id: ""
lb_clu_id: ""
