---
# Readiness: 1) Firewall 2) Controller/Satellite: start, затем по SSH проверка systemctl is-active (без портов)
# 3) Register-satellites после готовности сервисов; затем storage pool.

- hosts: linstor_cluster
  gather_facts: false
  become: true
  tasks:
    - name: create ansible temporary directory
      file:
        path: /tmp/ansible-tmp
        state: directory
        mode: '1777'

- hosts: linstor_storage_pool
  gather_facts: true
  become_user: root
  become: true
  tasks:
    - name: initialize disks for LINSTOR storage pool (LVM setup only)
      include_tasks: roles/linstor/storage-pool/tasks/disks.yaml

# UFW: reset all rules then allow only SSH (22) and LINSTOR ports from cluster network. Runs before controller/satellite.
- hosts: controller:satellite
  gather_facts: true
  become_user: root
  become: true
  roles:
    - { role: linstor/firewall, tags: [firewall, controller, satellite] }

- hosts: controller
  gather_facts: true
  become_user: root
  become: true
  roles:
    - { role: linstor/controller, tags: controller }

- hosts: satellite
  gather_facts: true
  become_user: root
  become: true
  roles:
    - { role: linstor/satellite, tags: satellite }

# Register satellite nodes on controller and wait until they are Online (runs after satellites are started)
- hosts: controller
  gather_facts: true
  become_user: root
  become: true
  tags: [controller]
  tasks:
    - name: register satellite nodes and wait for connection
      include_tasks: roles/linstor/controller/tasks/register-satellites.yaml

- hosts: linstor_storage_pool
  gather_facts: true
  become_user: root
  become: true
  tasks:
    - name: get node name for storage pool creation
      set_fact:
        node_name: "{{ hostvars[inventory_hostname]['ansible_nodename'] | default(inventory_hostname) }}"

    - name: create LINSTOR storage pool (lvm-thin) on first controller
      shell: |
        linstor storage-pool create lvmthin {{ node_name }} lvm-thin drbdpool/thinpool
      register: storage_pool_create_result
      delegate_to: "{{ groups['controller'][0] }}"
      failed_when: storage_pool_create_result.rc not in [0, 10]

    - name: display storage pool creation result
      debug:
        msg: |
          Storage pool creation result for {{ inventory_hostname }}:
          - Node: {{ node_name }}
          - Pool: lvm-thin
          - Volume group: drbdpool/thinpool
          - Result: {{ 'Success' if storage_pool_create_result.rc == 0 else ('Already exists' if storage_pool_create_result.rc == 10 else 'Failed') }}
          {{ 'Error: ' + storage_pool_create_result.stderr if storage_pool_create_result.rc not in [0, 10] and storage_pool_create_result.stderr is defined else '' }}

- hosts: admin
  gather_facts: true
  become_user: root
  become: true
  roles:
    - { role: linstor/gui, tags: gui }
